<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inviter legal documents">
  <title>Inviter Legal</title>
  <style>
    :root { color-scheme: light dark; --bg:#0c1018; --card:#141b27; --text:#f2f5fa; --muted:#aeb9ca; --accent:#8fc7ff; --line:#2b3749; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); padding:clamp(24px,6vw,48px); background:var(--card); border:1px solid var(--line); border-radius:18px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,7vw,3.2rem); line-height:1.1; }
    p { color:var(--muted); }
    nav { display:grid; gap:14px; margin-top:28px; }
    a { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:12px; color:var(--accent); text-decoration:none; font-weight:700; }
    a:hover, a:focus-visible { border-color:var(--accent); outline:none; }
    @media (prefers-color-scheme: light) { :root { --bg:#f2f5f9; --card:#fff; --text:#172033; --muted:#5e6878; --accent:#075baa; --line:#d8e0eb; } }
  </style>
</head>
<body>
  <main>
    <h1>Inviter</h1>
    <p>Legal documents / Юридичні документи</p>
    <nav aria-label="Legal documents">
      <a href="./privacy/">Privacy Policy / Політика конфіденційності</a>
      <a href="./terms/">Terms of Use / Правила користування</a>
      <a href="./delete-account/">Delete account / Видалити акаунт</a>
    </nav>
  </main>
</body>
</html>
